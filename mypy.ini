# Config surface type check (see .github/workflows/ci.yml).
# Only third-party packages without installed stubs and optional runtime
# modules are exempted; everything else stays strict about missing imports.
[mypy]

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-evolution_logger]
ignore_missing_imports = True

[mypy-tools.ai_mapper]
ignore_missing_imports = True

[mypy-ccxt.*]
ignore_missing_imports = True

[mypy-ta.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-hmmlearn.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True
